<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Empty data-URI favicon: silences the browser's automatic
         GET /favicon.ico request (a 404 otherwise) without shipping an asset. -->
    <link rel="icon" href="data:," />
    <title>Module Federation Host</title>
    <script>
      // Sets the theme before first paint to avoid a flash of the wrong one.
      // src/stores/theme.js owns it from mount onward.
      (() => {
        const preference = localStorage.getItem("theme-preference");
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
